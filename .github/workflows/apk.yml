name: 打包聚宝盆APK

on:
  push:
    branches: [main]
    paths: ['apk/**', 'ci/**', '.github/workflows/apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: 装依赖
        run: |
          pip install buildozer cython==0.29.36
          sudo apt-get update
          sudo apt-get install -y zip unzip patch autoconf automake libtool libtool-bin pkg-config ccache gettext

      - name: 修libffi宏路径
        run: |
          export ACLOCAL_PATH="/usr/share/aclocal"
          echo "ACLOCAL_PATH=/usr/share/aclocal" >> $GITHUB_ENV
          aclocal --print-ac-dir

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk-bundle 2>/dev/null || true
          sudo apt-get clean || true
          df -h / | tail -1

      - name: 预clone p4a并打libffi补丁
        run: |
          chmod +x ci/patch_p4a.sh && ./ci/patch_p4a.sh

      - name: 打包
        working-directory: apk
        run: |
          yes | buildozer android debug || buildozer android debug
          ls -la bin/

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: jubaopen-apk
          path: apk/bin/*.apk
