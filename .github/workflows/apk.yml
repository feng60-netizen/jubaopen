name: 打包聚宝盆APK

on:
  push:
    branches: [main]
    paths: ['apk/**', 'ci/**', '.github/workflows/apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: 装依赖
        run: |
          pip install buildozer cython==0.29.36
          sudo apt-get update
          sudo apt-get install -y zip unzip patch autoconf automake libtool libtool-bin pkg-config ccache gettext
          # 预装SDK组件并接受license(buildozer自动装时license随机失败=前几轮随机死因)
          export ANDROID_SDK_ROOT=/opt/android-sdk
          mkdir -p /opt/android-sdk
          cd /opt/android-sdk
          CMDLINETOOLS=/opt/android-sdk/cmdline-tools
          mkdir -p $CMDLINETOOLS
          curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -qo /tmp/clt.zip -d $CMDLINETOOLS
          mv $CMDLINETOOLS/cmdline-tools $CMDLINETOOLS/latest 2>/dev/null || true
          export PATH=$CMDLINETOOLS/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager "platform-tools" "platforms;android-31" "build-tools;34.0.0" "ndk;27.2.12479018" > /dev/null

      - name: 修libffi宏路径
        run: |
          export ACLOCAL_PATH="/usr/share/aclocal"
          echo "ACLOCAL_PATH=/usr/share/aclocal" >> $GITHUB_ENV
          aclocal --print-ac-dir

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk-bundle 2>/dev/null || true
          sudo apt-get clean || true
          df -h / | tail -1

      - name: 预clone p4a并打libffi补丁
        run: |
          chmod +x ci/patch_p4a.sh && ./ci/patch_p4a.sh

      - name: 打包
        working-directory: apk
        run: |
          (while true; do date +%H:%M:%S; free -m | sed -n 2p; sleep 20; done) &
          MON_PID=$!
          set +e
          buildozer android debug > /tmp/bd.log 2>&1 || true
          tail -60 /tmp/bd.log
          RC=${PIPESTATUS[1]:-1}
          set -e
          kill $MON_PID 2>/dev/null || true
          echo "=== buildozer exit=$RC, 日志尾部 ==="
          tail -5 /tmp/bd.log
          echo "=== 监控尾部(死亡前内存) ==="
          jobs -l || true
          echo "=== APK产物搜索 ==="
          find . -name "*.apk" -mmin -120 2>/dev/null | head -5
          ls -la bin/ 2>/dev/null
          echo "=== gradle诊断 ==="
          D=apk/.buildozer/android/platform/build-arm64-v8a/dists/jubaopen
          ls -la $D/gradlew 2>/dev/null
          cat $D/gradle/wrapper/gradle-wrapper.properties 2>/dev/null
          java -version 2>&1 | head -2

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: jubaopen-apk
          path: |
            apk/bin/*.apk
            apk/.buildozer/android/platform/**/bin/*.apk
