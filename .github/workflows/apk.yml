name: 打包聚宝盆APK

on:
  push:
    branches: [main]
    paths: ['apk/**', '.github/workflows/apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: 装依赖
        run: |
          pip install buildozer cython==0.29.36
          sudo apt-get update
          sudo apt-get install -y zip unzip patch autoconf automake libtool pkg-config ccache

      - name: 打包
        working-directory: apk
        run: |
          yes | buildozer android debug || buildozer android debug
          ls -la bin/

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: jubaopen-apk
          path: apk/bin/*.apk
