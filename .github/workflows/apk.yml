name: 打包聚宝盆APK

on:
  push:
    branches: [main]
    paths: ['apk/**', 'ci/**', '.github/workflows/apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: 装依赖
        run: |
          pip install buildozer cython==0.29.36
          sudo apt-get update
          sudo apt-get install -y zip unzip patch autoconf automake libtool libtool-bin pkg-config ccache gettext

      - name: 修libffi宏路径
        run: |
          export ACLOCAL_PATH="/usr/share/aclocal"
          echo "ACLOCAL_PATH=/usr/share/aclocal" >> $GITHUB_ENV
          aclocal --print-ac-dir

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk-bundle 2>/dev/null || true
          sudo apt-get clean || true
          df -h / | tail -1

      - name: 预clone p4a并打libffi补丁
        run: |
          chmod +x ci/patch_p4a.sh && ./ci/patch_p4a.sh

      - name: 打包
        working-directory: apk
        run: |
          (while true; do date +%H:%M:%S; free -m | sed -n 2p; sleep 20; done) &
          MON_PID=$!
          set +e
          yes | buildozer android debug 2>&1 | tee /tmp/bd.log
          RC=${PIPESTATUS[1]:-1}
          set -e
          kill $MON_PID 2>/dev/null || true
          echo "=== buildozer exit=$RC, 日志尾部 ==="
          tail -5 /tmp/bd.log
          echo "=== 监控尾部(死亡前内存) ==="
          jobs -l || true
          echo "=== APK产物搜索 ==="
          find . -name "*.apk" -newer /tmp -mmin -60 2>/dev/null | head -5
          ls -la bin/ 2>/dev/null

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: jubaopen-apk
          path: |
            apk/bin/*.apk
            apk/.buildozer/android/platform/**/bin/*.apk
