<!doctype html><html lang=zh><meta charset=utf-8><title>聚宝盆 · 统一驾驶舱</title>
<style>body{font-family:system-ui;background:#0d0d0f;color:#eee;max-width:860px;margin:2em auto;padding:0 1em}
.card{background:#1c1c1e;border-radius:12px;padding:16px;margin:12px 0}
h1{font-size:1.4em} h2{font-size:1.05em;margin:0 0 8px}
.ok{color:#4cd964}.bad{color:#ff453a}.warn{color:#ffd60a}.muted{color:#888}
button{background:#0a84ff;color:#fff;border:0;border-radius:8px;padding:8px 14px;margin:4px;cursor:pointer}
button.ghost{background:#2c2c2e}
table{width:100%;border-collapse:collapse;font-size:.92em}td,th{padding:6px;border-bottom:1px solid #333;text-align:left}
select,input{background:#2c2c2e;color:#eee;border:1px solid #3a3a3c;border-radius:8px;padding:7px;margin:3px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
<h1>🪙 聚宝盆 · 统一驾驶舱</h1>
<div class=grid>
<div class=card><h2>⭐ 自适应评分榜</h2><div id=scores class=muted>加载中…</div>
<div class=row><span class=muted>当前策略</span><select id=strategy onchange=setStrategy(this.value)>
<option>adaptive</option><option>priority</option><option>round_robin</option><option>least_used</option><option>free_first</option><option>speed_first</option>
</select></div></div>
<div class=card><h2>🪙 今日额度</h2><div id=summary class=muted>加载中…</div>
<button onclick=signin()>一键签到</button></div>
</div>
<div class=card><h2>🧩 一问多答（Cherry Studio 式对比）</h2>
<div class=row><input id=cmpq style="flex:1" placeholder="问点什么，同时发给所有模型对比…">
<button onclick=compare()>对比</button></div>
<div id=cmpout class=muted>结果将显示在这里（含延迟与质量分，质量分会反哺自适应路由）</div></div>
<div class=card><h2>🏆 账号 · 积分 · 签到</h2><table id=accounts></table></div>
<div class=card><h2>📥 免费模型目录（TryModels 式）</h2>
<div class=muted>点「入池」自动写进 config.json，无需手动编辑</div>
<table id=catalog></table></div>
<div class=card><h2>➕ 手动添加账号</h2>
<div class=row><input id=n placeholder=名称><input id=p placeholder=平台><input id=k placeholder=APIKey><input id=q placeholder=每日额度 type=number><button onclick=add()>加入聚宝盆</button></div></div>
<script>
const J='http://127.0.0.1:6210',P='http://127.0.0.1:6120',K='sk-freepool-fixed-2026';
async function load(){
 try{const s=await(await fetch(P+'/scores')).json();
  document.getElementById('strategy').value=s.strategy;
  document.getElementById('scores').innerHTML='<table><tr><th>#</th><th>模型</th><th>评分</th><th>延迟</th><th>成功</th><th>质量</th><th>积分权</th></tr>'+
   s.models.map((m,i)=>`<tr><td>${i+1}</td><td>${m.name}</td><td class=${m.score>=60?'ok':m.score>=40?'warn':'bad'}><b>${m.score}</b></td><td>${m.latencyMs??'—'}</td><td>${m.success}</td><td>${m.quality}</td><td>${m.pointsWeight}</td></tr>`).join('')+
   `<tr><td colspan=7 class=muted style=font-size:.85em>${s.weights}</td></tr>`;
 }catch(e){document.getElementById('scores').textContent='FreePool离线'}
 try{const q=await(await fetch(J+'/quota')).json();
  document.getElementById('summary').innerHTML=`剩余 <b class=${q.totalRemain>0?'ok':'bad'}>${q.totalRemain}</b> / ${q.totalQuota} · 已用 ${q.totalUsed} · ${q.date}`;
 }catch(e){document.getElementById('summary').textContent='聚宝盆离线'}
 try{const p=await(await fetch(J+'/points')).json();
  document.getElementById('accounts').innerHTML='<tr><th>账号</th><th>积分</th><th>连签</th><th>今日</th></tr>'+
   p.accounts.map(a=>`<tr><td>${a.name}</td><td class=ok>${a.points}</td><td>${a.streak}天</td><td>${a.signedToday?'<span class=ok>已签</span>':'<span class=warn>未签</span>'}</td></tr>`).join('')+
   `<tr><td colspan=4 class=ok>总积分 ${p.totalPoints}</td></tr>`;
 }catch(e){}
 try{const c=await(await fetch(P+'/catalog')).json();
  document.getElementById('catalog').innerHTML='<tr><th>模型</th><th>平台</th><th>说明</th><th>注册</th><th></th></tr>'+
   c.public.map(m=>`<tr><td>${m.id}</td><td>${m.provider}</td><td>${m.note}</td><td class=muted>${m.signup}</td>
   <td><button class=ghost onclick=promptAdd('${m.id}','${m.provider}')>入池</button></td></tr>`).join('');
 }catch(e){}
}
async function setStrategy(v){await fetch(P+'/pool/strategy',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+K},body:JSON.stringify({mode:v})});toast('策略已切到 '+v);load()}
async function signin(){const r=await(await fetch(J+'/signin',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();toast(r.message);load()}
async function compare(){const q=cmpq.value;if(!q)return toast('先输入问题');
 cmpout.textContent='正在并行询问所有模型…';
 const r=await(await fetch(P+'/v1/compare',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+K},body:JSON.stringify({messages:[{role:'user',content:q}]})})).json();
 cmpout.innerHTML=r.compare.map(x=>x.ok
  ?`<div class=card><b>${x.model}</b> <span class=muted>${x.latencyMs}ms · 质量分 ${x.qualityScore}</span><p>${x.content||''}</p></div>`
  :`<div class=card><b>${x.model}</b> <span class=bad>失败: ${x.error}</span></div>`).join('');
 load()}
async function promptAdd(id,provider){const key=prompt('填入 '+provider+' 的 API Key（留空=免Key模式）');if(key===null)return;
 const r=await(await fetch(P+'/catalog/add',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+K},
  body:JSON.stringify({name:id,provider,base_url:'https://auto/'+id+'/chat/completions',api_key:key,model:id,free:!key})})).json();
 toast(r.message||r.error);load()}
async function add(){const r=await(await fetch(J+'/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.value,platform:p.value,api_key:k.value,daily_quota:+q.value||0})})).json();toast(r.message||r.error);load()}
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;padding:10px 18px;border-radius:10px';document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
load();setInterval(load,30000)
</script>
